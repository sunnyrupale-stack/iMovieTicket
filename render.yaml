services:
  - type: web
    name: imovies-ticket-booking
    env: node
    plan: free
    buildCommand: npm run install:all && npm run build:client
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
